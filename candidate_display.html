<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group 5: Candidate Results</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --surface: #060014;
    --surface2: #0d0028;
    --border: #1a006e;
    --accent: #FFE000;
    --accent-dim: rgba(255,224,0,0.10);
    --accent-mid: rgba(255,224,0,0.4);
    --text: #ffffff;
    --muted: #6655aa;
    --warn: #ff8bff;
    --danger: #ff0000;
    --ghost-red: #FF0000;
    --ghost-pink: #FFB8FF;
    --ghost-cyan: #00FFFF;
    --ghost-orange: #FFB852;
    --mono: 'Press Start 2P', monospace;
    --sans: 'Press Start 2P', monospace;
  }

  @keyframes pellet-scroll {
    0%   { background-position: 0 0; }
    100% { background-position: -40px 0; }
  }

  @keyframes pacman-chomp {
    0%, 100% { clip-path: polygon(50% 50%, 100% 15%, 100% 0%, 0% 0%, 0% 100%, 100% 100%, 100% 85%); }
    50%       { clip-path: polygon(50% 50%, 100% 50%, 100% 0%, 0% 0%, 0% 100%, 100% 100%, 100% 50%); }
  }

  @keyframes ghost-float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-4px); }
  }

  @keyframes blink-muted {
    0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  body {
    background: var(--bg);
    background-image: radial-gradient(circle, #1a006e 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 40px 24px;
    image-rendering: pixelated;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 40px;
  }

  header h1 {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(255,224,0,0.6);
  }

  header span {
    font-family: var(--mono);
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .pac-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 28px;
    overflow: hidden;
    padding: 4px 0;
  }

  .pacman {
    width: 24px; height: 24px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
    animation: pacman-chomp 0.25s linear infinite;
    box-shadow: 0 0 8px rgba(255,224,0,0.5);
  }

  .pellets {
    display: flex;
    gap: 14px;
    align-items: center;
    flex: 1;
  }

  .pellet {
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.7;
    animation: blink-muted 1.2s ease-in-out infinite;
  }

  .pellet:nth-child(2) { animation-delay: 0.15s; }
  .pellet:nth-child(3) { animation-delay: 0.3s; }
  .pellet:nth-child(4) { animation-delay: 0.45s; }
  .pellet:nth-child(5) { animation-delay: 0.6s; }
  .pellet:nth-child(6) { animation-delay: 0.75s; }
  .pellet:nth-child(7) { animation-delay: 0.9s; }
  .pellet:nth-child(8) { animation-delay: 1.05s; }

  .ghosts { display: flex; gap: 10px; flex-shrink: 0; }

  .ghost {
    width: 20px; height: 20px;
    border-radius: 10px 10px 0 0;
    animation: ghost-float 1s ease-in-out infinite;
    position: relative;
  }

  .ghost::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0; right: 0;
    height: 6px;
    background: inherit;
    clip-path: polygon(0% 0%, 16% 100%, 33% 40%, 50% 100%, 66% 40%, 83% 100%, 100% 0%);
  }

  .ghost-r { background: var(--ghost-red);    animation-delay: 0s; }
  .ghost-p { background: var(--ghost-pink);   animation-delay: 0.2s; }
  .ghost-c { background: var(--ghost-cyan);   animation-delay: 0.4s; }
  .ghost-o { background: var(--ghost-orange); animation-delay: 0.6s; }

  .container { max-width: 820px; margin: 0 auto; }

  /* Drop zone */
  #drop-zone {
    border: 2px solid var(--border);
    border-radius: 0px;
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    margin-bottom: 16px;
    outline: 2px solid #000;
    outline-offset: -6px;
  }

  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
    box-shadow: 0 0 20px rgba(255,224,0,0.15), inset 0 0 20px rgba(255,224,0,0.05);
  }

  #drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  #drop-zone .dz-icon {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 16px;
    display: block;
    text-shadow: 0 0 8px rgba(255,224,0,0.5);
  }

  #drop-zone p {
    font-family: var(--mono);
    font-size: 8px;
    color: var(--muted);
    line-height: 2.2;
  }

  #drop-zone p strong {
    color: var(--accent);
    font-weight: 500;
  }

  /* Paste area */
  .paste-row {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
  }

  textarea {
    flex: 1;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 0;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 12px;
    resize: vertical;
    height: 80px;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(255,224,0,0.2); }
  textarea::placeholder { color: var(--muted); }

  button {
    background: var(--accent);
    border: none;
    border-radius: 0;
    color: #000;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 0 20px;
    text-transform: uppercase;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    white-space: nowrap;
    align-self: stretch;
    box-shadow: 0 0 12px rgba(255,224,0,0.4);
  }

  button:hover { opacity: 0.9; box-shadow: 0 0 20px rgba(255,224,0,0.6); }
  button:active { transform: scale(0.97); }

  .btn-ghost {
    background: transparent;
    border: 2px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    font-size: 8px;
    box-shadow: none;
  }

  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); opacity: 1; box-shadow: 0 0 10px rgba(255,224,0,0.2); }

  /* Results */
  #results { display: none; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .filename {
    font-family: var(--mono);
    font-size: 8px;
    color: var(--accent);
    background: var(--surface2);
    padding: 6px 12px;
    border: 1px solid var(--border);
    text-shadow: 0 0 6px rgba(255,224,0,0.4);
  }

  /* Metrics */
  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 32px;
  }

  .metric {
    background: var(--surface);
    border: 2px solid var(--border);
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
  }

  .metric::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(255,224,0,0.6);
  }

  .metric-label {
    font-family: var(--mono);
    font-size: 7px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .metric-value {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
    text-shadow: 0 0 16px rgba(255,224,0,0.5);
  }

  .metric-unit {
    font-size: 10px;
    color: var(--muted);
    margin-left: 4px;
  }

  /* Function table */
  .section-label {
    font-family: var(--mono);
    font-size: 7px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ghost-cyan);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
    text-shadow: 0 0 8px rgba(0,255,255,0.4);
  }

  .fn-table { width: 100%; border-collapse: collapse; }

  .fn-table thead tr {
    border-bottom: 2px solid var(--border);
  }

  .fn-table th {
    font-family: var(--mono);
    font-size: 7px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 12px;
    text-align: left;
  }

  .fn-table th:last-child { text-align: right; }

  .fn-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .fn-table tbody tr:nth-child(1) .rank { color: var(--ghost-red); text-shadow: 0 0 6px var(--ghost-red); }
  .fn-table tbody tr:nth-child(2) .rank { color: var(--ghost-pink); text-shadow: 0 0 6px var(--ghost-pink); }
  .fn-table tbody tr:nth-child(3) .rank { color: var(--ghost-cyan); text-shadow: 0 0 6px var(--ghost-cyan); }
  .fn-table tbody tr:nth-child(4) .rank { color: var(--ghost-orange); text-shadow: 0 0 6px var(--ghost-orange); }
  .fn-table tbody tr:nth-child(5) .rank { color: var(--accent); text-shadow: 0 0 6px rgba(255,224,0,0.6); }

  .fn-table tbody tr:nth-child(1) .bar-fill { background: var(--ghost-red); box-shadow: 0 0 6px var(--ghost-red); }
  .fn-table tbody tr:nth-child(2) .bar-fill { background: var(--ghost-pink); box-shadow: 0 0 6px var(--ghost-pink); }
  .fn-table tbody tr:nth-child(3) .bar-fill { background: var(--ghost-cyan); box-shadow: 0 0 6px var(--ghost-cyan); }
  .fn-table tbody tr:nth-child(4) .bar-fill { background: var(--ghost-orange); box-shadow: 0 0 6px var(--ghost-orange); }
  .fn-table tbody tr:nth-child(5) .bar-fill { background: var(--accent); box-shadow: 0 0 6px rgba(255,224,0,0.5); }

  .fn-table tbody tr:last-child { border-bottom: none; }
  .fn-table tbody tr:hover { background: var(--surface2); }

  .fn-table td {
    padding: 14px 12px;
    vertical-align: middle;
  }

  .rank {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    width: 28px;
  }

  .fn-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text);
    max-width: 320px;
  }

  .fn-name .file {
    font-size: 10px;
    color: var(--muted);
    display: block;
    margin-top: 2px;
  }

  .bar-cell { width: 180px; }

  .bar-track {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 0;
    height: 6px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .calls-cell {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    text-align: right;
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(255,224,0,0.4);
  }

  .pct {
    font-size: 8px;
    color: var(--muted);
    margin-left: 4px;
  }

  /* Error */
  .error {
    background: rgba(255,0,0,0.08);
    border: 2px solid rgba(255,0,0,0.4);
    color: var(--danger);
    font-family: var(--mono);
    font-size: 8px;
    line-height: 2;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: none;
    text-shadow: 0 0 6px rgba(255,0,0,0.4);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Call Tracker</h1>
    <span>// cProfile result inspector</span>
  </header>

  <div class="pac-row">
    <div class="pacman"></div>
    <div class="pellets">
      <div class="pellet"></div><div class="pellet"></div><div class="pellet"></div>
      <div class="pellet"></div><div class="pellet"></div><div class="pellet"></div>
      <div class="pellet"></div><div class="pellet"></div>
    </div>
    <div class="ghosts">
      <div class="ghost ghost-o"></div>
      <div class="ghost ghost-c"></div>
      <div class="ghost ghost-p"></div>
      <div class="ghost ghost-r"></div>
    </div>
  </div>

  <div id="error-msg" class="error"></div>

  <!-- Input area -->
  <div id="input-area">
    <div id="drop-zone">
      <input type="file" id="file-input" accept=".txt,.py,*" onchange="loadFile(this)">
      <span class="dz-icon">[ INSERT COIN ]</span>
      <p><strong>DROP A Candidate Result FILE</strong><br>or click to browse</p>
    </div>

    <div class="paste-row">
      <textarea id="paste-area" placeholder="...or paste raw cProfile output here"></textarea>
      <button onclick="parseInput()">RUN →</button>
    </div>
  </div>

  <!-- Results -->
  <div id="results">
    <div class="results-header">
      <span class="filename" id="filename-label">candidateResult</span>
      <button class="btn-ghost" onclick="reset()">← new file</button>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Total function calls</div>
        <div class="metric-value" id="total-calls">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Total time</div>
        <div class="metric-value" id="total-time">—</div>
      </div>
    </div>

    <div class="section-label">Top 5 — most called functions</div>

    <table class="fn-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Function</th>
          <th class="bar-cell"></th>
          <th>Calls</th>
        </tr>
      </thead>
      <tbody id="fn-list"></tbody>
    </table>
  </div>

</div>

<script>
  const dropZone = document.getElementById('drop-zone');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  });

  function loadFile(input) {
    const file = input.files[0];
    if (file) readFile(file);
  }

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('paste-area').value = e.target.result;
      document.getElementById('filename-label').textContent = file.name;
      parseInput();
    };
    reader.readAsText(file);
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function clearError() {
    document.getElementById('error-msg').style.display = 'none';
  }

  function parseInput() {
    clearError();
    const text = document.getElementById('paste-area').value.trim();
    if (!text) { showError('// nothing to parse — paste cProfile output or load a file'); return; }

    // Total calls + time
    const summaryMatch = text.match(/([\d,]+)\s+function calls.*?in\s+([\d.]+)\s+seconds/);
    if (!summaryMatch) { showError('// could not parse cProfile summary line — make sure this is raw cProfile output'); return; }

    const totalCalls = parseInt(summaryMatch[1].replace(/,/g, ''));
    const totalTime  = parseFloat(summaryMatch[2]);

    // Parse data rows
    const rows = [];
    for (const line of text.split('\n')) {
      const m = line.trim().match(/^(\d+(?:\/\d+)?)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+(.+)$/);
      if (!m) continue;
      const calls   = parseInt(m[1].split('/')[0]);
      const rawLoc  = m[6].trim();

      // Extract clean function name and file hint
      let fnName = rawLoc;
      let fileHint = '';
      const parenMatch = rawLoc.match(/\(([^)]+)\)$/);
      if (parenMatch) {
        fnName = parenMatch[1];
        fileHint = rawLoc.replace(/\([^)]+\)$/, '').trim();
      }

      rows.push({ calls, fnName, fileHint });
    }

    if (!rows.length) { showError('// no profiled rows found — check format'); return; }

    rows.sort((a, b) => b.calls - a.calls);
    const top5    = rows.slice(0, 5);
    const maxCalls = top5[0].calls;

    // Render metrics
    document.getElementById('total-calls').innerHTML =
      totalCalls.toLocaleString();
    document.getElementById('total-time').innerHTML =
      totalTime < 0.001
        ? '&lt;0.001<span class="metric-unit">s</span>'
        : totalTime.toFixed(4) + '<span class="metric-unit">s</span>';

    // Render rows
    const tbody = document.getElementById('fn-list');
    tbody.innerHTML = top5.map((fn, i) => {
      const pct = Math.round(fn.calls / totalCalls * 100);
      const barW = Math.round(fn.calls / maxCalls * 100);
      return `
        <tr>
          <td class="rank">${i + 1}</td>
          <td class="fn-name">
            ${escHtml(fn.fnName)}
            ${fn.fileHint ? `<span class="file">${escHtml(fn.fileHint)}</span>` : ''}
          </td>
          <td class="bar-cell">
            <div class="bar-track">
              <div class="bar-fill" style="width:0%" data-target="${barW}"></div>
            </div>
          </td>
          <td class="calls-cell">${fn.calls.toLocaleString()}<span class="pct">${pct}%</span></td>
        </tr>`;
    }).join('');

    // Animate bars after paint
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll('.bar-fill').forEach(el => {
        el.style.width = el.dataset.target + '%';
      });
    }));

    document.getElementById('input-area').style.display = 'none';
    document.getElementById('results').style.display = 'block';
  }

  function reset() {
    document.getElementById('paste-area').value = '';
    document.getElementById('file-input').value = '';
    document.getElementById('filename-label').textContent = 'candidateResult';
    document.getElementById('input-area').style.display = 'block';
    document.getElementById('results').style.display = 'none';
    clearError();
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
